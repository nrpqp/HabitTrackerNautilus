<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f1a" />
    <link rel="apple-touch-icon" href="/icon.svg">
    <title>Rastreador de Hábitos - Nautilus</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <header>
        <button id="theme-toggle" class="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema">
          <span class="theme-icon-light">☀️</span>
          <span class="theme-icon-dark">🌙</span>
        </button>
        <button id="info-btn" class="info-toggle" title="Cómo instalar" aria-label="Cómo instalar">
          <span>ℹ️</span>
        </button>
        <button id="add-habit-btn" class="add-toggle" title="Añadir hábito" aria-label="Añadir hábito">+</button>
        <h1>Rastreador de Hábitos</h1>
        <p>Reto de 21 Días - Nautilus</p>
      </header>

      <div class="svg-container" id="svg-container">
        <!-- SVG injected here -->
        <canvas id="effect-overlay"></canvas>
      </div>

      <!-- Panel contextual de hábito (bottom sheet / popover) -->
      <div id="habit-sheet" class="habit-sheet hidden">
        <div class="habit-sheet-backdrop"></div>
        <div class="habit-sheet-panel">
          <div class="habit-sheet-handle"></div>
          <input
            type="text"
            id="sheet-name-input"
            class="sheet-name-input"
            maxlength="15"
            placeholder="Nombre del hábito"
          />
          <div id="sheet-swatches" class="sheet-swatches"></div>
          <div id="sheet-progress" class="sheet-progress"></div>
          <div id="sheet-notification" class="sheet-notification" style="display:none">
            <label class="notif-toggle-row">
              <span class="notif-label">⏰ Recordatorio diario</span>
              <input type="checkbox" id="sheet-notif-toggle" class="notif-toggle" />
            </label>
            <div id="sheet-notif-time-row" class="notif-time-row notif-hidden">
              <input type="time" id="sheet-notif-time" class="notif-time-input" value="08:00" />
              <p class="notif-limit-note">Funciona si la app fue abierta ese día. En iOS la entrega en background es limitada.</p>
            </div>
            <p id="sheet-notif-denied" class="notif-denied notif-hidden">🔕 Notificaciones bloqueadas. Habilítalas en la configuración de tu navegador.</p>
          </div>
          <div id="sheet-actions" class="sheet-actions">
            <button id="sheet-reset-btn" class="sheet-action-btn sheet-reset">↺ Reiniciar</button>
            <button id="sheet-delete-btn" class="sheet-action-btn sheet-danger">× Eliminar</button>
          </div>
        </div>
      </div>

      <!-- Tooltip flotante para el SVG -->
      <div id="cell-tooltip" class="cell-tooltip"></div>

      <!-- Toast de milestone -->
      <div id="milestone-toast" class="milestone-toast">
        <span class="milestone-ico" id="milestone-ico">🌟</span>
        <div class="milestone-title" id="milestone-title">¡Primera semana!</div>
        <div class="milestone-sub" id="milestone-sub">7 días completados</div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
