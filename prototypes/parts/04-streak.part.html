<!--{"title":"04 · Racha","subtitle":"Cometa que recorre la racha y la vuelve a encender","favicon":"☄️","file":"04-streak.html"}-->
<style>
  .streak-badge {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .streak-badge .s-flame { font-size: 1.5rem; line-height: 1; filter: saturate(1.2); }
  .streak-badge .s-num {
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: -.04em;
    line-height: 1;
    color: var(--text-main);
  }
  .streak-badge .s-cap {
    font-size: .6rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .streak-badge.cold { opacity: .45; }
  .streak-badge.cold .s-flame { filter: grayscale(1); }
</style>

<div class="lab-stage">
  <div class="nautilus" id="stage">
    <div class="streak-badge" id="badge">
      <span class="s-flame">🔥</span>
      <span class="s-num">0</span>
      <span class="s-cap">racha</span>
    </div>
  </div>
</div>
<p class="hint">
  Marcar un día no es un evento aislado: es el eslabón siguiente de una cadena. El <b>cometa</b> sale
  del inicio de la racha, recorre todo lo ya conseguido reencendiéndolo y estalla en la celda nueva.
  Cuanto más larga la racha, más largo y caro de ganar el recorrido. Romper la racha lo apaga.
</p>
<div class="dock" id="dock"></div>

<script>
(() => {
  FX.setup({
    title: '04 · Racha',
    subtitle: 'Cometa que recorre la racha y la vuelve a encender',
  });

  const stage = document.getElementById('stage');
  const badge = document.getElementById('badge');
  const habits = FX.demoHabits();
  let activeRing = 1;
  let mode = 'comet';   // comet | chain

  const N = new FX.Nautilus(stage, habits, {
    onCell: (e, hi, d, prev) => { activeRing = hi; onMark(hi, d, prev); },
  });
  const cv = FX.makeCanvas(stage);

  // ── Insignia de racha ───────────────────────────────────────
  function refreshBadge(bounce) {
    const n = N.streak(activeRing);
    const num = badge.querySelector('.s-num');
    num.textContent = n;
    badge.classList.toggle('cold', n === 0);
    badge.querySelector('.s-flame').textContent =
      n === 0 ? '🕯️' : n >= 21 ? '🏆' : n >= 14 ? '⚡' : n >= 7 ? '🔥' : '✨';
    if (bounce && FX.tier.value > 0) {
      badge.animate([
        { transform: 'translate(-50%,-50%) scale(1)' },
        { transform: 'translate(-50%,-50%) scale(1.32)', offset: .3 },
        { transform: 'translate(-50%,-50%) scale(1)' },
      ], { duration: 520, easing: 'cubic-bezier(.2,1.6,.35,1)' });
    }
  }

  // ── Cometa a lo largo del arco ──────────────────────────────
  let comet = null;
  function launchComet(hi, from, to, onPass) {
    const { cx, cy } = N.m;
    const { rMid } = N.rings[hi];
    const k = cv.w / N.m.size;
    const a0 = N.angles[from].mid;
    const a1 = N.angles[to].mid;
    const span = Math.abs(to - from) + 1;
    const dur = Math.min(1250, 130 + span * 78);
    const rgb = FX.elRGB(habits[hi].element, to);
    const spr = FX.glowSprite(rgb);
    const trail = [];
    const passed = new Set();
    const t0 = performance.now();

    if (comet) comet.dead = true;
    const me = comet = { dead: false };

    function frame(t) {
      if (me.dead) return;
      const u = Math.min(1, (t - t0) / dur);
      const ease = 1 - Math.pow(1 - u, 2.2);
      const a = a0 + (a1 - a0) * ease;
      const pt = FX.polar(cx, cy, rMid, a);
      trail.push({ x: pt.x * k, y: pt.y * k });
      if (trail.length > (FX.tier.value >= 3 ? 26 : 16)) trail.shift();

      const ctx = cv.ctx;
      ctx.clearRect(0, 0, cv.w, cv.h);
      ctx.globalCompositeOperation = 'lighter';
      trail.forEach((p, i) => {
        const f = i / trail.length;
        const s = (4 + 13 * f) * k;
        ctx.globalAlpha = Math.pow(f, 1.6) * .9;
        ctx.drawImage(spr, p.x - s, p.y - s, s * 2, s * 2);
      });
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;

      // Reencender la celda por la que acaba de pasar
      const dIdx = Math.round((a - FX.CFG.startAngle) / (FX.CFG.sweep / FX.CFG.DAYS) - .5);
      if (!passed.has(dIdx)) { passed.add(dIdx); onPass(dIdx); }

      if (u < 1) requestAnimationFrame(frame);
      else {
        me.dead = true;
        arrival(hi, to);
        // Apagado del rastro
        let fade = 1;
        (function out() {
          if (comet !== me && comet && !comet.dead) return;
          fade -= .12;
          const ctx2 = cv.ctx;
          ctx2.clearRect(0, 0, cv.w, cv.h);
          if (fade <= 0) return;
          ctx2.globalCompositeOperation = 'lighter';
          trail.forEach((p, i) => {
            const f = i / trail.length;
            const s = (4 + 13 * f) * k;
            ctx2.globalAlpha = Math.pow(f, 1.6) * .9 * fade;
            ctx2.drawImage(spr, p.x - s, p.y - s, s * 2, s * 2);
          });
          ctx2.globalCompositeOperation = 'source-over';
          ctx2.globalAlpha = 1;
          requestAnimationFrame(out);
        })();
      }
    }
    requestAnimationFrame(frame);
  }

  function ignite(hi, d, strength = 1) {
    const c = N.cells[hi][d];
    if (!c || FX.tier.value === 0) return;
    const frames = [
      { transform: 'scale(1)', filter: 'brightness(1)' },
      { transform: `scale(${1 + .13 * strength})`, filter: `brightness(${1 + .9 * strength})`, offset: .25 },
      { transform: 'scale(1)', filter: 'brightness(1)' },
    ];
    if (FX.tier.value < 2) frames.forEach(f => delete f.filter);
    c.animate(frames, { duration: 420, easing: 'cubic-bezier(.2,1,.3,1)' });
  }

  function arrival(hi, d) {
    ignite(hi, d, 1.4);
    const c = N.cellCenterPx(hi, d);
    const rgb = FX.elRGB(habits[hi].element, d);
    const k = cv.w / N.m.size;
    burst.emit(FX.tier.budget(14), (i, n) => {
      const a = (i / n) * Math.PI * 2 + Math.random() * .4;
      const sp = (1.4 + Math.random() * 2.2) * k;
      return {
        x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, maxLife: 26 + Math.random() * 20,
        size: (2 + Math.random() * 3) * k, rgb, drag: .95, g: .05 * k,
      };
    });
    const n = N.streak(hi);
    if (n > 0 && n % 7 === 0) {
      FX.haptics.milestone();
      FX.toast(n >= 21 ? '🏆' : n >= 14 ? '⚡' : '🔥', `Racha de ${n}`,
        n >= 21 ? 'Reto completo' : `${n / 7} semana${n > 7 ? 's' : ''} seguidas`);
    } else {
      FX.haptics.success();
    }
  }

  const burst = new FX.Particles(cv, {
    additive: true, max: 260,
    draw: (ctx, p) => {
      const fade = Math.pow(1 - p.t, .8);
      ctx.globalAlpha = fade;
      const s = p.size * (1 + p.t);
      ctx.drawImage(FX.glowSprite(p.rgb), -s * 2, -s * 2, s * 4, s * 4);
    },
  });

  // ── Marcar / desmarcar ──────────────────────────────────────
  function onMark(hi, d, prev) {
    refreshBadge(true);
    if (prev) { extinguish(hi, d); return; }

    const streak = N.streak(hi);
    const from = Math.max(0, d - streak + 1);

    if (mode === 'chain' || FX.tier.value < 2) {
      // Variante barata: sólo escalonado de transform/opacity, sin canvas.
      for (let x = from; x <= d; x++) {
        const delay = (x - from) * 55;
        setTimeout(() => ignite(hi, x, x === d ? 1.4 : .55), delay);
      }
      setTimeout(() => arrivalLite(hi, d), (d - from) * 55 + 60);
      return;
    }
    if (streak <= 1) { arrival(hi, d); return; }
    launchComet(hi, from, d, (dd) => { if (dd < d) ignite(hi, dd, .5); });
  }

  function arrivalLite(hi, d) {
    const n = N.streak(hi);
    if (n > 0 && n % 7 === 0) {
      FX.haptics.milestone();
      FX.toast(n >= 21 ? '🏆' : '🔥', `Racha de ${n}`, 'Modo cadena — sin canvas');
    } else FX.haptics.success();
  }

  function extinguish(hi, d) {
    FX.haptics.denied();
    if (FX.tier.value === 0) return;
    // Chispazo apagándose: la celda se desatura hacia el gris de vacía.
    const c = N.cells[hi][d];
    c.animate([
      { filter: 'brightness(1) saturate(1)' },
      { filter: 'brightness(.6) saturate(.2)', offset: .5 },
      { filter: 'brightness(1) saturate(1)' },
    ], { duration: 420, easing: 'ease-out' });
    for (let x = d + 1; x < FX.CFG.DAYS; x++) {
      const cc = N.cells[hi][x];
      if (!cc) break;
      cc.animate([{ opacity: 1 }, { opacity: .3, offset: .4 }, { opacity: 1 }],
        { duration: 380, delay: (x - d) * 26, easing: 'ease-out' });
    }
  }

  // ── Dock ────────────────────────────────────────────────────
  const dock = document.getElementById('dock');

  dock.appendChild(FX.chipGroup('Anillo', habits.map((h, i) => ({ value: i, label: h.name })),
    activeRing, v => { activeRing = Number(v); refreshBadge(true); }));

  dock.appendChild(FX.chipGroup('Modo', [
    { value: 'comet', label: '☄️ Cometa', title: 'Canvas aditivo — Tier 2+' },
    { value: 'chain', label: '⛓️ Cadena', title: 'Sólo transform/opacity — Tier 1' },
  ], 'comet', v => mode = v));

  dock.appendChild(FX.actionBtn('▶︎ Simular día', () => {
    const d = N.todayIndex(activeRing);
    if (habits[activeRing].progress[d]) return;
    habits[activeRing].progress[d] = true;
    N.paint();
    onMark(activeRing, d, false);
  }, 'Marca el siguiente día del anillo activo'));

  dock.appendChild(FX.tierGroup());

  dock.appendChild(FX.actionBtn('↺ Reiniciar', () => {
    const fresh = FX.demoHabits();
    habits.forEach((h, i) => h.progress = fresh[i].progress);
    N.paint(); burst.clear(); refreshBadge(false);
  }));

  refreshBadge(false);
  FX.startGovernor(fps => FX.toast('🐢', 'Bajando de tier', `Sostenía ${fps.toFixed(0)} fps`));
})();
</script>
